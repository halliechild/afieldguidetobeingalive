<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>a field guide to being alive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FFFFFF; --paper:#FFFFFF; --ink:#232830;
  --olive:#485978; --camel:#FFEFD0;
  --c-archive:#FFB133; --c-believer:#485978; --c-observer:#A3D9E2; --c-margins:#C9A24A; --c-author:#232830;
  color-scheme: light;
}
*{box-sizing:border-box; text-transform:lowercase;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0; background:var(--cream); color:var(--ink); font-family:'Lora',serif; line-height:1.65; padding-bottom:env(safe-area-inset-bottom,0px); min-height:100%;}
.marker{font-family:'Fredoka',sans-serif; letter-spacing:.3px; font-weight:600;}
button{font-family:inherit; cursor:pointer; border:none; background:none;}
img{max-width:100%; display:block;}
body.viewer-mode .edit-only{display:none !important;}

header{background:var(--paper); padding:calc(14px + env(safe-area-inset-top,0px)) 20px 12px; position:sticky; top:0; z-index:5; border-bottom:1px solid rgba(0,0,0,.06);}
.header-row{max-width:860px; margin:0 auto; display:flex; flex-direction:column; align-items:flex-start; gap:8px;}
.brand span{font-size:clamp(1.7rem,5vw,2.3rem); font-family:'Fredoka',sans-serif; font-weight:700; color:var(--c-author);}
nav{display:flex; gap:18px; flex-wrap:wrap; position:relative; padding-bottom:9px;}
nav::after{content:''; position:absolute; left:0; right:0; bottom:0; height:3px; border-radius:2px;
  background:linear-gradient(90deg,#232830,#A3D9E2,#FFB133,#485978,#C9A24A,#485978);}
nav button{opacity:.68; font-size:.9rem; padding:2px 0 6px; border:none; background:none; transition:opacity .15s,font-weight .15s;}
nav button[data-view="home"]{color:#232830;}
nav button[data-view="observer"]{color:#3F9DB3;}
nav button[data-view="archive"]{color:#E08F1A;}
nav button[data-view="believer"]{color:#485978;}
nav button[data-view="margins"]{color:#C9A24A;}
nav button[data-view="author"]{color:#485978;}
nav button.active{opacity:1; font-weight:600;}
nav button:hover{opacity:1;}

main{max-width:860px; margin:0 auto; padding:0 20px;}
.view{display:none; animation:fadein .35s ease;}
.view.active{display:block;}
@keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}

/* Home */
.home{padding:36px 0 20px;}
.cover-photo, .cover-photo-empty{width:100%; aspect-ratio:16/10; border-radius:8px;}
.cover-photo{object-fit:cover;}
.cover-photo-empty{background:linear-gradient(135deg,var(--camel),var(--olive)); display:flex; align-items:center; justify-content:center; color:#fff; cursor:pointer;}
.cover-photo-empty svg{width:44px; height:44px; opacity:.85;}
.home h1{font-size:clamp(2.6rem,10vw,4.2rem); color:var(--c-author); margin:26px 0 12px; font-weight:700; line-height:1.05; font-family:'Fredoka',sans-serif;}
.home .about-short{font-size:1.05rem; opacity:.9; max-width:60ch; margin:0 0 8px;}
.home .purpose{font-style:italic; opacity:.8; max-width:60ch; margin:0 0 10px;}
.edit-link{font-size:.78rem; color:var(--olive); text-decoration:underline; opacity:.7;}
.edit-link:hover{opacity:1;}
.latest{margin-top:44px; border-top:1px solid rgba(0,0,0,.08); padding-top:22px;}
.latest h2{font-size:1.1rem; margin:0 0 14px; font-family:'Fredoka',sans-serif; font-weight:600; color:var(--ink); opacity:.8;}
.latest-item{display:flex; align-items:baseline; gap:10px; padding:9px 0; border-bottom:1px solid rgba(0,0,0,.05); cursor:pointer;}
.latest-item .tag{font-size:.68rem; font-weight:700; padding:2px 8px; border-radius:10px; color:#fff; flex:0 0 auto;}
.latest-item .t{flex:1; font-size:.94rem;}
.latest-item .d{font-size:.75rem; opacity:.55; flex:0 0 auto;}
.tag.archive{background:var(--c-archive);} .tag.believer{background:var(--c-believer);} .tag.observer{background:var(--c-observer);} .tag.margins{background:var(--c-margins);}

.viewbar{display:flex; justify-content:space-between; align-items:center; margin:32px 0 18px; gap:12px;}
.viewbar h2{font-size:1.4rem; margin:0; font-family:'Fredoka',sans-serif; font-weight:600;}
#view-observer .viewbar h2{color:var(--c-observer);}
#view-archive .viewbar h2{color:var(--c-archive);}
#view-believer .viewbar h2{color:var(--c-believer);}
#view-margins .viewbar h2{color:var(--c-margins);}
#view-author .viewbar h2{color:var(--olive);}
.btn{font-family:'Fredoka',sans-serif; font-weight:600; padding:9px 18px; border-radius:5px; font-size:.86rem; box-shadow:0 2px 0 rgba(0,0,0,.1); transition:transform .12s; color:#fff;}
.btn:active{transform:translateY(1px);}
.btn.save{background:var(--olive);}
.btn.cancel{background:transparent; color:var(--olive); box-shadow:none; border:1px solid var(--camel);}
.btn.danger{background:var(--c-archive);}
.btn-observer{background:var(--c-observer);} .btn-archive{background:var(--c-archive);} .btn-believer{background:var(--c-believer);} .btn-margins{background:var(--c-margins);}

/* Archive feed - photo journal */
#feedArchive{display:grid; gap:20px; margin-bottom:60px;}
.card{background:var(--paper); border-radius:8px; overflow:hidden; cursor:pointer; box-shadow:0 3px 8px rgba(0,0,0,.07); transition:transform .15s,box-shadow .15s; border:1px solid rgba(0,0,0,.05);}
.card:hover{transform:translateY(-2px); box-shadow:0 8px 16px rgba(0,0,0,.1);}
.card .meta{padding:14px 18px 18px;}
.date-badge{display:inline-block; border:1.5px solid var(--ink); padding:3px 10px; font-size:.7rem; letter-spacing:1.5px; font-weight:600; margin-bottom:8px;}
.mini-grid{display:grid; grid-template-columns:repeat(3,1fr); grid-auto-rows:70px; gap:3px;}
.mini-grid img{width:100%; height:100%; object-fit:cover;}
.mini-grid img:first-child:nth-last-child(n+3){grid-column:span 2; grid-row:span 2;}
.big-grid{display:grid; grid-template-columns:repeat(3,1fr); grid-auto-rows:clamp(80px,20vw,140px); gap:5px; margin-bottom:18px;}
.big-grid img{width:100%; height:100%; object-fit:cover; border-radius:3px; cursor:zoom-in;}
.big-grid img:first-child:nth-last-child(n+3){grid-column:span 2; grid-row:span 2;}
.big-grid.single{display:block;}
.big-grid.single img{width:100%; aspect-ratio:16/10; border-radius:6px;}
.card h3{font-family:'Fredoka',sans-serif; font-weight:600; font-size:1.2rem; margin:5px 0 6px; color:var(--c-archive);}
.card p{margin:0; font-size:.95rem; opacity:.8;}

/* Believer feed - reflective */
#feedBeliever{display:grid; gap:16px; margin-bottom:60px;}
.thought{background:var(--paper); border-left:3px solid var(--c-believer); border-radius:4px; padding:18px 22px; cursor:pointer; transition:transform .15s;}
.thought:hover{transform:translateX(2px);}
.thought .date{font-size:.76rem; color:var(--c-believer); font-weight:600;}
.thought h3{font-family:'Fredoka',sans-serif; font-weight:600; font-size:1.1rem; margin:6px 0 8px; color:var(--c-believer);}
.thought p{margin:0; font-style:italic; opacity:.85;}

/* Margins feed - quotes/snippets */
#feedMargins{display:grid; gap:14px; margin-bottom:60px;}
.snippet{border-left:3px solid var(--c-margins); padding:10px 18px; cursor:pointer; transition:transform .15s;}
.snippet:hover{transform:translateX(2px);}
.snippet .date{font-size:.72rem; color:var(--c-margins); font-weight:600;}
.snippet p{margin:4px 0 0; font-style:italic; opacity:.85;}

/* Observer - photo-app masonry columns */
.masonry{columns:2 220px; column-gap:10px; margin-bottom:60px;}
@media(min-width:640px){.masonry{columns:3 220px;}}
.obs-item{break-inside:avoid; margin-bottom:10px; border-radius:6px; overflow:hidden; cursor:pointer; position:relative;}
.obs-item img{width:100%; display:block; aspect-ratio:1; object-fit:cover;}
.obs-item .cap{font-size:.78rem; padding:6px 2px 0; opacity:.75;}

.empty{text-align:center; padding:44px 20px; font-style:italic; opacity:.7;}

/* Author */
.author{padding:20px 0 60px; display:flex; gap:26px; flex-wrap:wrap; align-items:flex-start;}
.author .pic{width:150px; height:150px; border-radius:8px; object-fit:cover; background:var(--camel); flex:0 0 auto;}
.author .bio{flex:1; min-width:220px;}
.author .bio-text{white-space:pre-wrap; opacity:.88;}

/* Overlays */
.overlay{position:fixed; inset:0; background:rgba(30,22,14,.5); display:none; align-items:flex-start; justify-content:center; padding:calc(30px + env(safe-area-inset-top,0px)) 16px 30px; overflow-y:auto; z-index:10;}
.overlay.open{display:flex;}
.sheet{background:var(--paper); width:100%; max-width:600px; border-radius:10px; padding:30px clamp(18px,5vw,40px) 34px; position:relative; box-shadow:0 14px 30px rgba(0,0,0,.22);}
.sheet .close{position:absolute; top:12px; right:14px; color:var(--olive); font-size:1.2rem; font-family:'Fredoka',sans-serif;}
.field-label{font-size:.78rem; color:var(--olive); margin:16px 0 4px;}
.field-label:first-of-type{margin-top:2px;}
input[type=text], textarea{width:100%; border:none; border-bottom:1px solid var(--camel); background:transparent; font-family:'Lora',serif; color:var(--ink); font-size:1rem; padding:6px 2px; resize:vertical;}
input[type=text]{font-family:'Fredoka',sans-serif; font-weight:600; font-size:1.2rem; border-bottom:1px solid var(--c-archive);}
textarea{min-height:120px; line-height:1.8;}
input:focus, textarea:focus{outline:none; border-bottom-color:var(--olive);}
input[type=file]{font-size:.85rem; margin-top:4px;}
.row{display:flex; gap:10px; margin-top:22px; flex-wrap:wrap;}
.detail h2{font-family:'Fredoka',sans-serif; font-weight:600; font-size:1.6rem; margin:8px 0 16px; color:var(--c-archive);}
.detail img{border-radius:8px;}
.detail .body{white-space:pre-wrap; font-size:1.03rem;}
.hint{font-size:.75rem; opacity:.55; margin-top:4px;}
.photo-previews{display:flex; flex-wrap:wrap; gap:14px; margin-top:10px;}
.pv{width:110px;}
.pv .thumb{position:relative; width:110px; height:110px; border-radius:6px; overflow:hidden;}
.pv .thumb img{width:100%; height:100%; object-fit:cover;}
.pv .thumb button{position:absolute; top:3px; right:3px; background:rgba(0,0,0,.55); color:#fff; width:18px; height:18px; border-radius:50%; font-size:.7rem; line-height:1;}
.pv input[type=range]{width:100%; margin-top:4px; height:14px;}
.pv .lbl{font-size:.62rem; opacity:.6;}
</style>
</head>
<body>

<header>
  <div class="header-row">
    <div class="brand"><span>a field guide to being alive</span></div>
    <nav id="navBar">
      <button data-view="home" onclick="showSection('home')">home</button>
      <button data-view="observer" onclick="showSection('observer')">the observer</button>
      <button data-view="archive" onclick="showSection('archive')">the archive</button>
      <button data-view="believer" onclick="showSection('believer')">the believer</button>
      <button data-view="margins" onclick="showSection('margins')">the margins</button>
      <button data-view="author" onclick="showSection('author')">the author</button>
    </nav>
  </div>
</header>

<main>
  <section class="view" id="view-home">
    <div class="home">
      <img class="cover-photo" id="coverPhoto" alt="" style="display:none;">
      <div class="cover-photo-empty edit-only" id="coverPhotoEmpty" onclick="openEditHome()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10.5" r="1.5"/><path d="M21 15l-5-5-9 9"/></svg>
      </div>
      <h1>a field guide to being alive</h1>
      <p class="about-short" id="aboutShortText"></p>
      <p class="purpose" id="purposeText"></p>
      <button class="edit-link edit-only" onclick="openEditHome()">edit this</button>
      <div class="latest">
        <h2>recently added</h2>
        <div id="latestList"></div>
      </div>
    </div>
  </section>

  <section class="view" id="view-observer">
    <div class="viewbar"><h2>the observer</h2><button class="btn btn-observer edit-only" onclick="openCompose('observer')">+ new</button></div>
    <div class="masonry" id="feedObserver"></div>
  </section>

  <section class="view" id="view-archive">
    <div class="viewbar"><h2>the archive</h2><button class="btn btn-archive edit-only" onclick="openCompose('archive')">+ new</button></div>
    <div id="feedArchive"></div>
  </section>

  <section class="view" id="view-believer">
    <div class="viewbar"><h2>the believer</h2><button class="btn btn-believer edit-only" onclick="openCompose('believer')">+ new</button></div>
    <div id="feedBeliever"></div>
  </section>

  <section class="view" id="view-margins">
    <div class="viewbar"><h2>the margins</h2><button class="btn btn-margins edit-only" onclick="openCompose('margins')">+ new</button></div>
    <div id="feedMargins"></div>
  </section>

  <section class="view" id="view-author">
    <div class="viewbar"><h2>the author</h2><button class="edit-link edit-only" onclick="openEditAuthor()">edit this</button></div>
    <div class="author">
      <img class="pic" id="authorPic" alt="" style="display:none;">
      <div class="bio"><div class="bio-text" id="bioText"></div></div>
    </div>
  </section>
</main>

<div class="overlay" id="composeOverlay">
  <div class="sheet">
    <button class="close" onclick="closeOverlay('composeOverlay')">&times;</button>
    <div class="field-label" id="titleLabel">title</div>
    <input type="text" id="titleInput" placeholder="">
    <div id="photoField">
      <div class="field-label">photos (drag the sliders to adjust what part shows)</div>
      <input type="file" id="photoInput" accept="image/*" multiple>
      <div class="hint" id="photoStatus"></div>
      <div class="photo-previews" id="photoPreviews"></div>
    </div>
    <div class="field-label" id="bodyLabel">entry</div>
    <textarea id="bodyInput" placeholder=""></textarea>
    <div class="row">
      <button class="btn save" onclick="saveEntry()">save</button>
      <button class="btn cancel" onclick="closeOverlay('composeOverlay')">cancel</button>
    </div>
  </div>
</div>

<div class="overlay" id="detailOverlay"><div class="sheet detail" id="detailContent"></div></div>

<div class="overlay" id="homeEditOverlay">
  <div class="sheet">
    <button class="close" onclick="closeOverlay('homeEditOverlay')">&times;</button>
    <div class="field-label">cover photo</div>
    <input type="file" id="coverPhotoInput" accept="image/*">
    <div class="hint" id="coverPhotoStatus"></div>
    <div class="photo-previews" id="coverPhotoPreview"></div>
    <div class="field-label">a little about you</div>
    <textarea id="aboutShortInput" style="min-height:70px;"></textarea>
    <div class="field-label">purpose of this blog</div>
    <textarea id="purposeInput" style="min-height:90px;"></textarea>
    <div class="row">
      <button class="btn save" onclick="saveHome()">save</button>
      <button class="btn cancel" onclick="closeOverlay('homeEditOverlay')">cancel</button>
    </div>
  </div>
</div>

<div class="overlay" id="authorEditOverlay">
  <div class="sheet">
    <button class="close" onclick="closeOverlay('authorEditOverlay')">&times;</button>
    <div class="field-label">photo</div>
    <input type="file" id="authorPhotoInput" accept="image/*">
    <div class="hint" id="authorPhotoStatus"></div>
    <div class="photo-previews" id="authorPhotoPreview"></div>
    <div class="field-label">about you</div>
    <textarea id="bioInput"></textarea>
    <div class="row">
      <button class="btn save" onclick="saveAuthor()">save</button>
      <button class="btn cancel" onclick="closeOverlay('authorEditOverlay')">cancel</button>
    </div>
  </div>
</div>

inearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%220%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%237C9F52%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%233F5A2E%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width%3D%22200%22%20height%3D%22200%22%20fill%3D%22url%28%23g%29%22/%3E%3C/svg%3E", "x": 50, "y": 60}]}, {"id": "5", "section": "margins", "date": "2026-07-01", "title": "", "body": "note to self: you don't have to finish everything you start reading.", "photos": []}]</script>
<script id="siteData" type="application/json">{"purpose": "this is a small, ongoing field guide \u2014 to the outside world and to whatever i'm learning about being here.", "aboutShort": "hi, i'm keeping this as a record of what i notice and what i'm slowly figuring out.", "bio": "hi, i'm keeping this journal mostly for myself \u2014 a record of walks, quiet mornings, and the small realizations that come along with them.", "coverPhoto": null, "authorPhoto": null}</script>

<script>
let posts = JSON.parse(document.getElementById('postsData').textContent);
let site = JSON.parse(document.getElementById('siteData').textContent);
let editingId=null, currentSection='archive';
let pendingPhotos=[], pendingCoverPhoto=null, pendingAuthorPhoto=null;
let artifactAPI=null, assetsAPI=null;

function fmtDate(iso){ const d=new Date(iso+'T12:00:00'); return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}); }
function escapeHTML(s){ return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function assetUrl(id){ return id.startsWith('data:') ? id : '/_blob/'+id; }
function posStyle(p){ return `object-position:${p.x}% ${p.y}%`; }

function showSection(name){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active', b.dataset.view===name));
}

function renderArchive(){
  const feed=document.getElementById('feedArchive');
  const list=posts.filter(p=>p.section==='archive').sort((a,b)=>b.date.localeCompare(a.date));
  if(!list.length){ feed.innerHTML='<div class="empty">nothing archived yet.</div>'; return; }
  feed.innerHTML=list.map(p=>`
    <div class="card" onclick="openDetail('${p.id}')">
      ${(p.photos&&p.photos.length)?`<div class="mini-grid">${p.photos.slice(0,4).map(ph=>`<img src="${assetUrl(ph.id)}" style="${posStyle(ph)}" alt="">`).join('')}</div>`:''}
      <div class="meta">
        <div class="date-badge">${fmtDate(p.date)}</div>
        <h3>${escapeHTML(p.title)}</h3>
        <p>${escapeHTML(p.body).slice(0,120)}${p.body.length>120?'…':''}</p>
      </div>
    </div>`).join('');
}
function renderBeliever(){
  const feed=document.getElementById('feedBeliever');
  const list=posts.filter(p=>p.section==='believer').sort((a,b)=>b.date.localeCompare(a.date));
  if(!list.length){ feed.innerHTML='<div class="empty">no thoughts here yet.</div>'; return; }
  feed.innerHTML=list.map(p=>`
    <div class="thought" onclick="openDetail('${p.id}')">
      <div class="date">${fmtDate(p.date)}</div>
      <h3>${escapeHTML(p.title)}</h3>
      <p>${escapeHTML(p.body).slice(0,160)}${p.body.length>160?'…':''}</p>
    </div>`).join('');
}
function renderMargins(){
  const feed=document.getElementById('feedMargins');
  const list=posts.filter(p=>p.section==='margins').sort((a,b)=>b.date.localeCompare(a.date));
  if(!list.length){ feed.innerHTML='<div class="empty">nothing jotted down yet.</div>'; return; }
  feed.innerHTML=list.map(p=>`
    <div class="snippet" onclick="openDetail('${p.id}')">
      <div class="date">${fmtDate(p.date)}${p.title?' · '+escapeHTML(p.title):''}</div>
      <p>${escapeHTML(p.body)}</p>
    </div>`).join('');
}
function renderObserver(){
  const feed=document.getElementById('feedObserver');
  const list=posts.filter(p=>p.section==='observer'&&p.photos&&p.photos.length).sort((a,b)=>b.date.localeCompare(a.date));
  if(!list.length){ feed.innerHTML='<div class="empty">nothing noticed yet. add a photo.</div>'; return; }
  feed.innerHTML=list.map(p=>`
    <div class="obs-item" onclick="openDetail('${p.id}')">
      <img src="${assetUrl(p.photos[0].id)}" style="${posStyle(p.photos[0])}" alt="">
      ${p.title?`<div class="cap">${escapeHTML(p.title)}</div>`:''}
    </div>`).join('');
}
function renderLatest(){
  const list=[...posts].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
  const el=document.getElementById('latestList');
  if(!list.length){ el.innerHTML='<div class="empty">nothing posted yet.</div>'; return; }
  el.innerHTML=list.map(p=>`
    <div class="latest-item" onclick="openDetail('${p.id}')">
      <span class="tag ${p.section}">${p.section}</span>
      <span class="t">${escapeHTML(p.title||p.body.slice(0,40))}</span>
      <span class="d">${fmtDate(p.date)}</span>
    </div>`).join('');
}
function renderHome(){
  document.getElementById('aboutShortText').textContent=site.aboutShort;
  document.getElementById('purposeText').textContent=site.purpose;
  const img=document.getElementById('coverPhoto'), empty=document.getElementById('coverPhotoEmpty');
  if(site.coverPhoto){ img.src=assetUrl(site.coverPhoto.id); img.style.cssText='display:block;'+posStyle(site.coverPhoto); empty.style.display='none'; }
  else{ img.style.display='none'; empty.style.display='flex'; }
  renderLatest();
}
function renderAuthor(){
  document.getElementById('bioText').textContent=site.bio;
  const pic=document.getElementById('authorPic');
  if(site.authorPhoto){ pic.src=assetUrl(site.authorPhoto.id); pic.style.cssText='display:block;'+posStyle(site.authorPhoto); } else { pic.style.display='none'; }
}

function openOverlay(id){ document.getElementById(id).classList.add('open'); }
function closeOverlay(id){ document.getElementById(id).classList.remove('open'); }

function photoPreviewCard(photo, idx, removeCall, xCall, yCall){
  return `<div class="pv">
    <div class="thumb"><img src="${assetUrl(photo.id)}" style="${posStyle(photo)}" alt="">${removeCall?`<button onclick="${removeCall}">&times;</button>`:''}</div>
    <div class="lbl">left / right</div>
    <input type="range" min="0" max="100" value="${photo.x}" oninput="${xCall}">
    <div class="lbl">up / down</div>
    <input type="range" min="0" max="100" value="${photo.y}" oninput="${yCall}">
  </div>`;
}
function renderPhotoPreviews(){
  document.getElementById('photoPreviews').innerHTML = pendingPhotos.map((ph,i)=>
    photoPreviewCard(ph, i, `removePendingPhoto(${i})`, `updatePendingPhoto(${i},'x',this.value)`, `updatePendingPhoto(${i},'y',this.value)`)).join('');
}
function removePendingPhoto(i){ pendingPhotos.splice(i,1); renderPhotoPreviews(); }
function updatePendingPhoto(i,axis,val){ pendingPhotos[i][axis]=Number(val); renderPhotoPreviews(); }

function renderCoverPreview(){
  const el=document.getElementById('coverPhotoPreview');
  el.innerHTML = pendingCoverPhoto ? photoPreviewCard(pendingCoverPhoto, 0, null, `updateCoverPhoto('x',this.value)`, `updateCoverPhoto('y',this.value)`) : '';
}
function updateCoverPhoto(axis,val){ pendingCoverPhoto[axis]=Number(val); renderCoverPreview(); }
function renderAuthorPreview(){
  const el=document.getElementById('authorPhotoPreview');
  el.innerHTML = pendingAuthorPhoto ? photoPreviewCard(pendingAuthorPhoto, 0, null, `updateAuthorPhoto('x',this.value)`, `updateAuthorPhoto('y',this.value)`) : '';
}
function updateAuthorPhoto(axis,val){ pendingAuthorPhoto[axis]=Number(val); renderAuthorPreview(); }

const SECTION_COPY = {
  archive:{titleLabel:'title', titlePh:'where were you?', bodyLabel:'entry', bodyPh:'describe it, or just write what it felt like...', photos:true},
  observer:{titleLabel:'caption (optional)', titlePh:'a short caption', bodyLabel:'notes (optional)', bodyPh:'', photos:true},
  believer:{titleLabel:'a short title', titlePh:'what are you learning?', bodyLabel:'the thought', bodyPh:'write it out, as plainly or as messily as it comes...', photos:false},
  margins:{titleLabel:'title / source (optional)', titlePh:'', bodyLabel:'the quote or note', bodyPh:'jot it down...', photos:false}
};
function openCompose(section){
  editingId=null; pendingPhotos=[]; currentSection=section; renderPhotoPreviews();
  document.getElementById('titleInput').value='';
  document.getElementById('bodyInput').value='';
  document.getElementById('photoInput').value='';
  document.getElementById('photoStatus').textContent='';
  const c=SECTION_COPY[section];
  document.getElementById('titleLabel').textContent=c.titleLabel;
  document.getElementById('titleInput').placeholder=c.titlePh;
  document.getElementById('bodyLabel').textContent=c.bodyLabel;
  document.getElementById('bodyInput').placeholder=c.bodyPh;
  document.getElementById('photoField').style.display=c.photos?'block':'none';
  openOverlay('composeOverlay');
}
function openEdit(id){
  const p=posts.find(x=>x.id===id); if(!p) return;
  openCompose(p.section);
  editingId=id; pendingPhotos=(p.photos||[]).map(ph=>({...ph})); renderPhotoPreviews();
  document.getElementById('titleInput').value=p.title||'';
  document.getElementById('bodyInput').value=p.body||'';
  closeOverlay('detailOverlay'); openOverlay('composeOverlay');
}
function openDetail(id){
  const p=posts.find(x=>x.id===id); if(!p) return;
  document.getElementById('detailContent').innerHTML=`
    <button class="close" onclick="closeOverlay('detailOverlay')">&times;</button>
    ${(p.photos&&p.photos.length)?`<div class="big-grid${p.photos.length===1?' single':''}">${p.photos.map(ph=>`<img src="${assetUrl(ph.id)}" style="${posStyle(ph)}" alt="">`).join('')}</div>`:''}
    <div class="date-badge">${fmtDate(p.date)}</div>
    ${p.title?`<h2>${escapeHTML(p.title)}</h2>`:''}
    <div class="body">${escapeHTML(p.body)}</div>
    <div class="row edit-only">
      <button class="btn save" onclick="openEdit('${p.id}')">edit</button>
      <button class="btn danger" onclick="deleteEntry('${p.id}')">delete</button>
    </div>`;
  openOverlay('detailOverlay');
}
function deleteEntry(id){
  posts=posts.filter(x=>x.id!==id);
  closeOverlay('detailOverlay');
  renderAll(); persist();
}
async function ensureAssets(){ try{ if(!assetsAPI && window.claude) assetsAPI=await window.claude.use('assets'); }catch(e){} return assetsAPI; }

document.getElementById('photoInput').addEventListener('change', async e=>{
  const files=Array.from(e.target.files); if(!files.length) return;
  const status=document.getElementById('photoStatus');
  const a=await ensureAssets();
  if(!a){ status.textContent="photo upload isn't available in this view."; return; }
  for(const f of files){
    status.textContent='uploading…';
    try{ const r=await a.upload(f); pendingPhotos.push({id:r.id,x:50,y:50}); renderPhotoPreviews(); }
    catch(err){ status.textContent='could not upload one of the photos.'; }
  }
  status.textContent = pendingPhotos.length ? `${pendingPhotos.length} photo(s) attached — drag sliders to adjust framing.` : '';
  e.target.value='';
});
document.getElementById('coverPhotoInput').addEventListener('change', async e=>{
  const f=e.target.files[0]; if(!f) return;
  const status=document.getElementById('coverPhotoStatus'); status.textContent='uploading…';
  const a=await ensureAssets();
  if(!a){ status.textContent="photo upload isn't available in this view."; return; }
  try{ const r=await a.upload(f); pendingCoverPhoto={id:r.id,x:50,y:50}; renderCoverPreview(); status.textContent='photo attached — drag sliders to adjust framing.'; }
  catch(err){ status.textContent='could not upload photo.'; }
});
document.getElementById('authorPhotoInput').addEventListener('change', async e=>{
  const f=e.target.files[0]; if(!f) return;
  const status=document.getElementById('authorPhotoStatus'); status.textContent='uploading…';
  const a=await ensureAssets();
  if(!a){ status.textContent="photo upload isn't available in this view."; return; }
  try{ const r=await a.upload(f); pendingAuthorPhoto={id:r.id,x:50,y:50}; renderAuthorPreview(); status.textContent='photo attached — drag sliders to adjust framing.'; }
  catch(err){ status.textContent='could not upload photo.'; }
});

function saveEntry(){
  const title=document.getElementById('titleInput').value.trim();
  const body=document.getElementById('bodyInput').value.trim();
  const needsBody = currentSection!=='observer';
  if(needsBody && !body) return;
  if(currentSection==='archive' && !title) return;
  if(editingId){
    const p=posts.find(x=>x.id===editingId);
    p.title=title; p.body=body; p.photos=SECTION_COPY[currentSection].photos?pendingPhotos.slice():[];
  } else {
    posts.push({id:String(Date.now()), section:currentSection, date:new Date().toISOString().slice(0,10), title, body, photos:SECTION_COPY[currentSection].photos?pendingPhotos.slice():[]});
  }
  closeOverlay('composeOverlay');
  renderAll(); persist();
}
function openEditHome(){
  pendingCoverPhoto=null; renderCoverPreview();
  document.getElementById('aboutShortInput').value=site.aboutShort;
  document.getElementById('purposeInput').value=site.purpose;
  document.getElementById('coverPhotoInput').value='';
  document.getElementById('coverPhotoStatus').textContent='';
  openOverlay('homeEditOverlay');
}
function saveHome(){
  site.aboutShort=document.getElementById('aboutShortInput').value.trim();
  site.purpose=document.getElementById('purposeInput').value.trim();
  if(pendingCoverPhoto) site.coverPhoto=pendingCoverPhoto;
  closeOverlay('homeEditOverlay'); renderHome(); persist();
}
function openEditAuthor(){
  pendingAuthorPhoto=null; renderAuthorPreview();
  document.getElementById('bioInput').value=site.bio;
  document.getElementById('authorPhotoInput').value='';
  document.getElementById('authorPhotoStatus').textContent='';
  openOverlay('authorEditOverlay');
}
function saveAuthor(){
  site.bio=document.getElementById('bioInput').value.trim();
  if(pendingAuthorPhoto) site.authorPhoto=pendingAuthorPhoto;
  closeOverlay('authorEditOverlay'); renderAuthor(); persist();
}

function renderAll(){ renderHome(); renderArchive(); renderBeliever(); renderMargins(); renderObserver(); renderAuthor(); }

async function persist(){
  document.getElementById('postsData').textContent=JSON.stringify(posts);
  document.getElementById('siteData').textContent=JSON.stringify(site);
  try{
    if(!artifactAPI && window.claude) artifactAPI=await window.claude.use('artifact');
    if(artifactAPI) await artifactAPI.publish('<!DOCTYPE html>\n'+document.documentElement.outerHTML);
  }catch(e){}
}

renderAll();
showSection('home');
(async ()=>{
  let owner=false;
  try{
    if(window.claude){
      artifactAPI = await window.claude.use('artifact');
      assetsAPI = await window.claude.use('assets');
      owner = !!(artifactAPI && assetsAPI);
    }
  }catch(e){ owner=false; }
  document.body.classList.toggle('viewer-mode', !owner);
})();
</script>
</body>
</html>
